# Fragment for an existing workflow, NOT an automatically installed deployment.
# The build job must test the revision and export build/public-ddtt first.
# Add workflow_dispatch boolean input publish_pages, default false.
# Append this step to that successful build job:
package-step:
  name: Package Pages
  if: github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == 'refs/heads/main'
  uses: actions/upload-pages-artifact@v3
  with:
    path: build/public-ddtt
# Append this job under jobs (remove the fragment's wrapper keys):
pages-job:
  if: github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == 'refs/heads/main'
  needs: build
  runs-on: ubuntu-latest
  permissions:
    pages: write
    id-token: write
  environment:
    name: github-pages
    url: ${{ steps.deployment.outputs.page_url }}
  steps:
    - id: deployment
      uses: actions/deploy-pages@v4
