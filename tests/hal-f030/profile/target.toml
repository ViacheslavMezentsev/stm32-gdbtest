# RM0360/CubeF0 CMSIS profile; validated on Nucleo via J-Link STLink/SWD.
schema = 1
name = "f030r8"
mcu = "STM32F030R8T6"
openocd_target = "target/stm32f0x.cfg"
flash_start = 0x08000000
flash_size = 65536
flash_size_address = 0x1FFFF7CC
breakpoint_limit = 4
fault_handlers = ["HardFault_Handler"]
core_registers = ["pc", "lr", "sp", "xPSR"]
reset_halt = "monitor reset halt"
reset_run = "monitor reset run"

[identity]
address = 0x40015800
mask = 0xFFF
value = 0x440

# Cortex-M0 has no M3/M4 CFSR/HFSR registers.
[diagnostic_registers]
CPUID = 0xE000ED00
ICSR = 0xE000ED04
SCR = 0xE000ED10
