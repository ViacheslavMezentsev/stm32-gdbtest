# CI profile (WeAct BlackPill F401CC, LED on PC13); CMSIS-only firmware, not a HAL evidence.
schema = 1
name = "cif401cc"
mcu = "STM32F401CCU6"
openocd_target = "target/stm32f4x.cfg"
flash_start = 0x08000000
flash_size = 262144
flash_size_address = 0x1FFF7A22
breakpoint_limit = 6
fault_handlers = ["HardFault_Handler", "MemManage_Handler", "BusFault_Handler", "UsageFault_Handler"]
core_registers = ["pc", "lr", "sp", "xPSR"]
reset_halt = "monitor reset halt"
reset_run = "monitor reset run"

[identity]
address = 0xE0042000
mask = 0xFFF
value = 0x423

[diagnostic_registers]
CFSR = 0xE000ED28
HFSR = 0xE000ED2C
