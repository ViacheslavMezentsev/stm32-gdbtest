# CI profile (STM32F429I-DISCO, LD3 on PG13); CMSIS-only firmware, not a HAL evidence.
schema = 2
name = "cif429zi"
mcu = "STM32F429ZIT6"
openocd_target = "target/stm32f4x.cfg"
flash_start = 0x08000000
flash_size = 2097152
flash_size_address = 0x1FFF7A22
breakpoint_limit = 6
fault_handlers = ["HardFault_Handler", "MemManage_Handler", "BusFault_Handler", "UsageFault_Handler"]
core_registers = ["pc", "lr", "sp", "xPSR"]

# Reset dialect of OpenOCD, as read from this profile before schema 2.
[openocd]
reset_halt = "monitor reset halt"
reset_run = "monitor reset run"

[identity]
address = 0xE0042000
mask = 0xFFF
value = 0x419

[diagnostic_registers]
CFSR = 0xE000ED28
HFSR = 0xE000ED2C
