# CI profile (WeAct AT32F4 Core Board V1.0, LED on PC13, active low); Cortex-M4 compatible MCU from Artery,
# CMSIS of the Artery firmware library. Identity and Flash size: RM AT32F403A/407 V2.02, 27.4.1 and 1.3.
schema = 1
name = "ciat32f403a"
mcu = "AT32F403ACGU7"
# Artery's OpenOCD fork ships this script; the validated stand is J-Link (jlink_device).
openocd_target = "target/at32f403axx.cfg"
jlink_device = "AT32F403ACGU7"
flash_start = 0x08000000
flash_size = 1048576
flash_size_address = 0x1FFFF7E0
breakpoint_limit = 6
fault_handlers = ["HardFault_Handler", "MemManage_Handler", "BusFault_Handler", "UsageFault_Handler"]
core_registers = ["pc", "lr", "sp", "xPSR"]
reset_halt = "monitor reset halt"
reset_run = "monitor reset run"

[identity]
address = 0xE0042000
mask = 0xFFFFFFFF
value = 0x70050347

[diagnostic_registers]
CFSR = 0xE000ED28
HFSR = 0xE000ED2C
