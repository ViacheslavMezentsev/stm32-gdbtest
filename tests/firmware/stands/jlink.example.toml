# J-Link (also the J-Link STLink firmware on Nucleo). Copy to <profile>-jlink.local.toml.
# The serial is the decimal USB number shown by J-Link tools.
[probe]
backend = "jlink"
serial = "REPLACE_WITH_JLINK_SERIAL"
# Windows; on Linux (x86_64, arm64): "/opt/SEGGER/JLink/JLinkGDBServerCLExe".
executable = "C:/Program Files/SEGGER/JLink/JLinkGDBServerCL.exe"
speed_khz = 1000
flash = "if-different"
