name: Hardware

# Hardware runs on the owner's self-hosted stand (docs/en/HARDWARE_CI.md). Manual only:
# a public repository must never start a self-hosted runner from pull requests.
on:
  workflow_dispatch:
    inputs:
      profiles:
        description: 'CI profiles, space separated (f030r8 f103c8 f401cc f411ce f429zi at32f403a)'
        required: true
        default: 'f030r8 f103c8 f401cc f411ce f429zi at32f403a'
      suite:
        description: 'Hardware suite: lifecycle or the five API 0.4.0 runs per board'
        type: choice
        options: [lifecycle, api040]
        default: lifecycle
        required: true
      steps:
        description: 'run_hw.py steps, space separated; empty for all'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hardware-stand
  cancel-in-progress: false

jobs:
  prepare:
    # Build and prepare where the toolchain is; the stand only runs the packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROFILES: ${{ inputs.profiles }}
      SUITE: ${{ inputs.suite }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache pinned downloads (verified by SHA-256 on use)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.local/stm32-gdbtest/downloads
          key: linux-stand-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/linux-stand.lock.json') }}
      - name: Pinned toolchain of the stand environment
        run: python3 tools/linux_stand.py install --only python cmake ninja gcc cube
      - name: Build, prepare and pack the CI firmware
        run: |
          . "$HOME/.local/stm32-gdbtest/env.sh"
          case "$SUITE" in lifecycle|api040) ;; *) echo "Unknown suite: $SUITE"; exit 1 ;; esac
          mkdir -p build/packages
          for profile in $PROFILES; do
            case "$profile" in f030r8|f103c8|f401cc|f411ce|f429zi|at32f403a) ;; *) echo "Unknown profile: $profile"; exit 1 ;; esac
            if [ "$profile" = at32f403a ]; then
              export AT32_SDK_ROOT="$RUNNER_TEMP/at32-sdk"
              python3 tools/vendor_sdk.py --destination "$AT32_SDK_ROOT"
            fi
            (cd tests/firmware && cmake --preset "$profile" && cmake --build --preset "$profile" \
              && ctest --preset "$profile-offline")
            if [ "$SUITE" = api040 ]; then
              python3 -B tests/firmware/api040.py pack --session "tests/firmware/build/$profile/hwtest/session.json" \
                --output "tests/firmware/build/api040-pack/$profile"
              cp "tests/firmware/build/api040-pack/$profile/enabled.zip" "build/packages/$profile-enabled.zip"
              cp "tests/firmware/build/api040-pack/$profile/disabled.zip" "build/packages/$profile-disabled.zip"
            else
              python3 -B -m stm32_gdbtest pack --session "tests/firmware/build/$profile/hwtest/session.json" \
                --output "build/packages/$profile.zip"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ddtt-packages
          path: build/packages/*.zip
          if-no-files-found: error

  hardware:
    needs: prepare
    runs-on: [self-hosted, linux, ARM64, stm32-stand]
    timeout-minutes: 60
    env:
      PROFILES: ${{ inputs.profiles }}
      SUITE: ${{ inputs.suite }}
      STEPS: ${{ inputs.steps }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ddtt-packages
          path: build/packages
      - name: Doctor and hardware runs of the prepared packages
        run: |
          . "$HOME/.local/stm32-gdbtest/env.sh"
          stands="${STM32_GDBTEST_STANDS_DIR:-$HOME/.config/stm32-gdbtest/stands}"
          case "$SUITE" in lifecycle|api040) ;; *) echo "Unknown suite: $SUITE"; exit 1 ;; esac
          if [ "$SUITE" = api040 ] && [ -n "$STEPS" ]; then
            echo "steps applies only to lifecycle; leave it empty for api040"; exit 1
          fi
          status=0
          mkdir -p build/hw
          summary="build/hw/campaign-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tsv"
          printf 'profile\tdoctor_exit\thardware_exit\n' > "$summary"
          for profile in $PROFILES; do
            case "$profile" in f030r8|f103c8|f401cc|f411ce|f429zi|at32f403a) ;; *) echo "Unknown profile: $profile"; exit 1 ;; esac
            echo "::group::Hardware $profile"
            doctor_code=0
            hardware_code=0
            python3 -B -m stm32_gdbtest doctor --stand "$stands/$profile.toml" || doctor_code=$?
            if [ "$doctor_code" -ne 0 ]; then
              hardware_code=125 # not started after failed preflight
            elif [ "$SUITE" = api040 ]; then
              python3 -B tests/firmware/api040.py run --enabled-package "build/packages/$profile-enabled.zip" \
                --disabled-package "build/packages/$profile-disabled.zip" --stand "$stands/$profile.toml" \
                --output "build/hw/api040/$profile" || hardware_code=$?
            else
              python3 -B tests/firmware/run_hw.py --profile "$profile" --stand "$stands/$profile.toml" \
                --package "build/packages/$profile.zip" ${STEPS:+--steps $STEPS} || hardware_code=$?
            fi
            printf '%s\t%s\t%s\n' "$profile" "$doctor_code" "$hardware_code" >> "$summary"
            if [ "$doctor_code" -ne 0 ] || [ "$hardware_code" -ne 0 ]; then
              status=1
              echo "::error::Profile $profile failed: doctor=$doctor_code hardware=$hardware_code"
            fi
            echo "::endgroup::"
          done
          cat "$summary"
          exit $status
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hardware-results
          path: |
            build/hw/**/*.tsv
            build/hw/**/summary.json
            build/hw/**/run_hw.log
            build/hw/**/*.json
            build/hw/**/*.xml
            build/hw/**/*.csv
            build/hw/**/*.html
            build/hw/**/export.toml
            build/hw/**/*.log
          if-no-files-found: warn
