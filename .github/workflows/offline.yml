name: Offline

# Everything up to the GDB server: host tests and CI firmware, no debugger or board.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - .github/FUNDING.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-host:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Host tests on Windows (named mutex, process lifecycle)
        run: python -B -m unittest discover -s Tests/host -v

  linux-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build CI image
        run: |
          mkdir -p build
          set -o pipefail
          docker build --platform linux/amd64 --progress plain -f ci/docker/Dockerfile \
            -t stm32-gdbtest-ci:local . 2>&1 | tee build/ci-image.log
      - name: Formatting, host tests and CI firmware on every locked GCC x profile
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --mount "type=bind,source=$PWD,target=/workspace" \
            stm32-gdbtest-ci:local python3 ci/run_checks.py format host firmware
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-results
          path: |
            build/ci/
            build/ci-image.log
            Tests/firmware/build/*/ci.log
            Tests/firmware/build/*/hwtest/build-manifest.json
            Tests/firmware/build/*/hwtest/runs/*/result.json
          if-no-files-found: warn
