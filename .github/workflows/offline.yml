name: Offline

# Everything up to the GDB server: host tests and CI firmware, no debugger or board.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - .github/FUNDING.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-host:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Host tests on Windows (named mutex, process lifecycle)
        run: python -B -m unittest discover -s tests/host -v

  linux-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build CI image
        run: |
          mkdir -p build
          set -o pipefail
          docker build --platform linux/amd64 --progress plain -f ci/docker/Dockerfile \
            -t stm32-gdbtest-ci:local . 2>&1 | tee build/ci-image.log
      - name: Formatting, host tests and CI firmware on every locked GCC x profile
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            --mount "type=bind,source=$PWD,target=/workspace" \
            stm32-gdbtest-ci:local python3 ci/run_checks.py format host firmware hal
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: offline-results
          path: |
            build/ci/
            build/ci-image.log
            tests/hal-f030/build/ci/
            tests/firmware/build/ci/**/ci.log
            tests/firmware/build/ci/**/build-manifest.json
            tests/firmware/build/ci/**/result.json
          if-no-files-found: warn

  # Stand environment of tools/linux_stand.py on the oldest supported distribution
  # (Ubuntu 20.04, glibc 2.31) for both stand architectures, e.g. Orange Pi 5.
  linux-stand:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Multi-arch index digest of ubuntu:20.04 (amd64 and arm64); refresh deliberately.
    container: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    timeout-minutes: 30
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: System packages of a plain Ubuntu 20.04 stand
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get install -y --no-install-recommends ca-certificates curl git python3
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache pinned downloads (verified by SHA-256 on use)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.local/stm32-gdbtest/downloads
          key: linux-stand-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/linux-stand.lock.json') }}
      - name: Install the stand environment as a regular user would (no root needed)
        run: python3 tools/linux_stand.py install
      - name: Host tests on the stand Python
        run: |
          . "$HOME/.local/stm32-gdbtest/env.sh"
          python3 -B -m unittest discover -s tests/host -v
      - name: Doctor, CI firmware build and preparation with an OpenOCD stand
        run: |
          . "$HOME/.local/stm32-gdbtest/env.sh"
          stand="$RUNNER_TEMP/ci-openocd.local.toml"
          printf '[probe]\nbackend = "openocd"\nserial = "CI0000"\n' > "$stand"
          python3 -B -m stm32_gdbtest doctor --stand "$stand"
          for profile in f030r8 f103c8 f411ce; do
            python3 -B tests/firmware/run_hw.py --profile "$profile" --stand "$stand" --steps build prepare
          done
      - name: Keep results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-stand-${{ matrix.runner }}
          path: build/hw/
          if-no-files-found: warn
